<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Factory</title>
<style>
:root{--bg:#151515;--header:#202020;--panel:#242424;--panel2:#2b2b2b;--line:#3a3a3a;--text:#f0f0f0;--muted:#a7a7a7;--accent:#4aa3df;--danger:#e36b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{height:58px;background:var(--header);border-bottom:1px solid #383838;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:700;letter-spacing:.02em}.actions{display:flex;gap:8px;align-items:center}
button,.btn{border:1px solid #4a4a4a;background:var(--panel2);color:var(--text);padding:8px 13px;border-radius:4px;cursor:pointer;font:inherit}
button:hover,.btn:hover{background:#353535}.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.primary:hover{background:#3f92ca}.ghost{background:transparent}.danger{border-color:#693737;color:#ffaaaa}.user-pill{font-size:13px;color:var(--muted);margin-right:3px}
main{max-width:1380px;margin:0 auto;padding:22px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:38px}.robot-count{font-size:14px;color:var(--muted)}.sort-controls{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.sort-controls select{background:var(--panel2);color:var(--text);border:1px solid #4a4a4a;border-radius:4px;padding:8px 30px 8px 10px;font:inherit}.sort-direction{min-width:36px;padding:8px 10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.thumb{width:100%;aspect-ratio:216/116;object-fit:cover;background:#111;display:block}.card-body{padding:13px}.card h3{margin:0 0 6px;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-bottom:11px}.card-actions{display:flex;gap:8px;margin-top:11px}.card-actions button{flex:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(880px,100%);max-height:92vh;overflow:auto;background:#202020;border:1px solid #3d3d3d;border-radius:7px;box-shadow:0 20px 55px rgba(0,0,0,.45)}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-header h2{margin:0;font-size:20px}.modal-body{padding:18px}.form-grid{display:grid;gap:14px}.form-grid label{font-size:13px;color:#d6d6d6;display:grid;gap:7px}input,textarea{width:100%;background:#151515;color:var(--text);border:1px solid #414141;border-radius:4px;padding:10px 11px;font:inherit}input:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.help{font-size:12px;color:var(--muted)}.error{font-size:13px;color:#ff9292;margin-top:2px;min-height:18px}
.crop-layout{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:16px}.canvas-wrap{background:#101010;border:1px solid var(--line);border-radius:5px;overflow:hidden}.crop-canvas{display:block;width:100%;height:auto;touch-action:none}.preview-box{width:216px;max-width:100%;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#151515;align-self:start}.preview-box img{width:216px;max-width:100%;aspect-ratio:216/116;display:block;object-fit:cover}.preview-box .cap{padding:8px 9px;font-size:12px;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px}.detail img{width:100%;aspect-ratio:216/116;object-fit:cover;border-radius:5px;border:1px solid var(--line)}.detail h2{margin:0 0 6px}.detail .owner{color:var(--muted);font-size:13px;margin-bottom:6px}.detail .date{color:var(--muted);font-size:13px;margin-bottom:16px}.detail .description{white-space:pre-wrap;color:#d5d5d5;line-height:1.65}.detail-actions{margin-top:18px;display:flex;gap:10px}.detail-actions .danger{margin-left:auto}.preview-gallery{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.preview-gallery h3{margin:0 0 12px;font-size:15px}.preview-view{position:relative;background:#111;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:520px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}.preview-view img{width:100%;height:100%;display:block;object-fit:contain;background:#101010}.preview-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}.preview-nav button{min-width:42px}.preview-count{font-size:13px;color:var(--muted);min-width:58px;text-align:center}.preview-gallery .hidden{display:none!important}
.hidden{display:none!important}.image-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:28px;z-index:100}.image-lightbox.show{display:flex}.image-lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}.image-lightbox-close{position:absolute;right:18px;top:14px;width:42px;height:42px;border-radius:50%;font-size:28px;line-height:1;padding:0;background:#242424;border:1px solid #555;color:#fff}.image-lightbox-close:hover{background:#343434}@media(max-width:760px){.crop-layout,.detail{grid-template-columns:1fr}.actions .user-pill{display:none}.list-toolbar{align-items:flex-start;gap:10px;flex-direction:column}.sort-controls{width:100%}.sort-controls select{flex:1}header{padding:0 12px}main{padding:14px 18px}}
</style>
</head>
<body>
<header><div class="brand">Community Factory</div><div class="actions"><button id="uploadBtn" class="primary">Upload</button><span class="user-pill" id="userPill"></span><button id="loginBtn" class="ghost">Login</button><button id="registerBtn" class="ghost">Register</button><button id="logoutBtn" class="ghost hidden">Logout</button></div></header>
<main>
<div class="list-toolbar"><div id="robotCount" class="robot-count">0 bots</div><div class="sort-controls"><label for="sortSelect">Sort by</label><select id="sortSelect"><option value="created_at">Upload date</option><option value="username">Uploader</option><option value="name">Robot name</option></select><button id="sortDirection" class="sort-direction" type="button" title="Descending">↓</button></div></div>
<div id="grid" class="grid"></div>
</main>

<div id="authModal" class="modal-backdrop"><div class="modal"><div class="modal-header"><h2 id="authTitle">Login</h2><button data-close="authModal">×</button></div><div class="modal-body"><form id="authForm" class="form-grid"><label>Username<input id="authUsername" autocomplete="username" required maxlength="32"></label><label>Password<input id="authPassword" type="password" autocomplete="current-password" required minlength="6"></label><div class="error" id="authError"></div><button class="primary" type="submit" id="authSubmit">Login</button></form></div></div></div>

<div id="uploadModal" class="modal-backdrop"><div class="modal"><div class="modal-header"><h2>Upload Bot</h2><button data-close="uploadModal">×</button></div><div class="modal-body"><form id="uploadForm" class="form-grid"><label>Robot name<input id="robotName" required maxlength="120"></label><label>Description<textarea id="robotDescription" maxlength="2000"></textarea></label><label>Bot file<input id="botFile" type="file" required></label><label>Thumbnail<input id="thumbFile" type="file" accept="image/*" required><span class="help">Crop to the same 216:116 ratio as the site thumbnail. The saved image is automatically adjusted to stay within 1 MB.</span></label><div class="crop-layout"><div><div class="canvas-wrap"><canvas id="cropCanvas" class="crop-canvas"></canvas></div><div class="help" style="margin-top:8px">Drag the image to adjust the crop. Use the mouse wheel to zoom.</div></div><div class="preview-box"><img id="cropPreview" alt="preview"><div class="cap">Thumbnail preview</div></div></div><label>Preview images <span class="help">Optional. You can attach multiple images to show on the Bot Details page.</span><input id="previewFiles" type="file" accept="image/*" multiple><span id="previewFileList" class="help">No preview images selected.</span></label><div class="error" id="uploadError"></div><div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" data-close="uploadModal">Cancel</button><button class="primary" type="submit">Upload</button></div></form></div></div></div>

<div id="detailModal" class="modal-backdrop"><div class="modal"><div class="modal-header"><h2>Bot Details</h2><button data-close="detailModal">×</button></div><div class="modal-body" id="detailBody"><div class="preview-gallery hidden" id="detailPreviewBox"><h3>Preview images</h3><div class="preview-view"><img id="detailPreviewImage" alt="Bot preview"></div><div class="preview-nav"><button type="button" id="detailPrev">←</button><span class="preview-count" id="detailPreviewCount">1 / 1</span><button type="button" id="detailNext">→</button></div></div></div></div></div>
<div id="imageLightbox" class="image-lightbox" aria-hidden="true"><button id="imageLightboxClose" class="image-lightbox-close" type="button" aria-label="Close">×</button><img id="imageLightboxImage" alt="Preview image"></div>
<script src="/app.js"></script>
</body></html>
